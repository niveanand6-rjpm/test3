<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lakshmi Fancy Store</title>
<link rel="stylesheet" href="css/style.css?v=20260816">
<!-- PDF export for printable reports/bills -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <!-- ============ LOGIN SCREEN ============ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="emblem">L</div>
      <h2>Lakshmi Fancy Store</h2>
      <p class="tag">Sales Person Access</p>
      <form id="loginForm" onsubmit="attemptLogin(event)">
        <div class="field text-center">
          <input type="password" id="loginPassword" placeholder="Enter password" required autofocus style="text-align:center;">
        </div>
        <div class="error-msg hidden" id="loginError">Incorrect password. Please try again.</div>
        <button class="btn btn-primary mt-16" type="submit" style="width:100%;">Unlock</button>
      </form>
      <p class="text-soft mt-16" style="font-size:.72rem;">Password is set and can be reset by the Admin.</p>
      <p class="mt-8" style="font-size:.72rem;"><a href="#" onclick="confirmResetAppData(event)">Trouble logging in? Reset app data on this device</a></p>
    </div>
  </div>

  <!-- ============ APP SCREEN ============ -->
  <div id="appScreen" class="hidden">
    <header class="store-header">
      <span id="logoSlot"></span>
      <div>
        <h1 id="storeNameSlot">Lakshmi Fancy Store</h1>
        <div class="sub" id="storeSubSlot"></div>
      </div>
      <div class="spacer"></div>
      <select id="employeeSelect" class="employee-select" onchange="onEmployeeChange(this.value)" title="Sales person on duty"></select>
      <button class="logout-btn" onclick="doLogout()">Lock</button>
    </header>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="daily" onclick="switchTab('daily')">🛍️ Daily Sales</button>
      <button class="tab-btn" data-tab="rental" onclick="switchTab('rental')">💍 Rental</button>
      <button class="tab-btn" data-tab="catalog" onclick="switchTab('catalog')">📋 Catalog</button>
      <button class="tab-btn" data-tab="expenses" onclick="switchTab('expenses')">🧾 Expenses</button>
      <button class="tab-btn" data-tab="summary" onclick="switchTab('summary')">📆 Recent Sales Summary</button>
    </nav>

    <main id="mainContent"></main>
    <footer class="site-footer" id="siteFooter"></footer>
    <button id="goTopBtn" class="go-top-btn" onclick="LFS.scrollToTop()" title="Go to top" aria-label="Go to top">⬆️</button>
  </div>

  <script src="js/common.js?v=20260816"></script>
  <script src="js/app.js?v=20260816"></script>
</body>
</html>
